<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
<!-- Texture linen: 2 lớp noise dị hướng (sợi ngang + sợi dọc), tile 160. CSS opacity .06. Thay cho 2 lớp repeating-linear-gradient 1px (dễ moiré ở DPR 2.6-3). -->
<filter id="h" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012 .9" numOctaves="2" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.15 0 0 0 0 0.12 0 0 0 1 0"/></filter><filter id="v" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9 .012" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.15 0 0 0 0 0.12 0 0 0 1 0"/></filter><rect width="160" height="160" filter="url(#h)"/><rect width="160" height="160" filter="url(#v)" opacity=".8"/>
</svg>
