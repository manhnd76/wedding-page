<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<!-- Texture paper-aged: noise giấy + vết ố nâu tần số thấp (ngưỡng hoá), tile 240. CSS opacity .07 + gradient tối 2 mép trái/phải. -->
<filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.25 0 0 0 0 0.17 0 0 0 0 0.08 0 0 0 1 0"/></filter><filter id="o" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .42 0 0 0 0 .26 0 0 0 0 .08 0 0 0 -3.2 1.9"/><feComponentTransfer><feFuncA type="linear" slope=".9"/></feComponentTransfer></filter><rect width="240" height="240" filter="url(#n)"/><rect width="240" height="240" filter="url(#o)"/>
</svg>
